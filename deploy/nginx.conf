# Identity Platform — single-host reverse proxy for Railway (and similar).
# Identity web at /, Fieldkit at /demo/, API on the same origin.
# Listen port is rewritten by entrypoint from $PORT (default 8080).

server {
    listen 8080;
    server_name _;

    client_max_body_size 2m;
    root /usr/share/nginx/html;

    # FastAPI — must be before SPA fallbacks
    location ~ ^/(auth|oauth|me|webauthn|admin|health|\.well-known)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
    }

    location = /demo {
        return 301 /demo/;
    }

    # Fieldkit (apps/demo) — built with base /demo/
    location ^~ /demo/ {
        try_files $uri $uri/ /demo/index.html;
    }

    # Identity web (apps/web)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
